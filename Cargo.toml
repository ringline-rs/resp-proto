[package]
name = "resp-proto"
version = "0.0.2"
edition = "2024"
# Minimum supported Rust version. Edition 2024 already required 1.85; this
# records the real floor rather than leaving it implicit.
rust-version = "1.88"
license = "MIT OR Apache-2.0"
repository = "https://github.com/ringline-rs/resp-proto"
description = "RESP2/RESP3 protocol parser and encoder"
readme = "README.md"
keywords = ["redis", "resp", "protocol", "parser"]
categories = ["network-programming", "parsing"]

[features]
default = []
resp3 = ["dep:ryu"]

[dependencies]
bytes = "1"
memchr = "2"
itoa = "1"
ryu = { version = "1", optional = true }
thiserror = "2"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }
